# Pin the lint rule set. CI installs ruff unpinned, and ruff 0.17 widened its
# default selection, which fails `ruff check .` on code that passed before.
# These are the defaults the codebase was written against (pycodestyle errors
# + Pyflakes); widen deliberately, in its own PR, rather than by upgrade.
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F"]
